services:
  caddy:
    image: caddy:2-alpine
    container_name: next-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nestjs-backend:
        condition: service_started

  nestjs-backend:
    image: ${ECR_IMAGE}
    container_name: next-backend
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: next-postgres
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - next_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: next-redis
    restart: unless-stopped
    volumes:
      - next_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  next_pg_data:
  next_redis_data:
